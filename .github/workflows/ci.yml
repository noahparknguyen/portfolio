# Runs the same seven checks as `npm run check`, so none of them depends on
# someone remembering to run it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # `npm ci` rather than `npm install`, so the lockfile is what gets tested.
      - run: npm ci

      # Ordered cheapest-first, so an obvious failure reports in seconds rather
      # than after the browser pass.
      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      # Catches docs/index.html's colour tokens falling out of step with
      # src/index.css, which nothing else can see.
      - name: Config consistency
        run: npm run check:config

      - name: Style allowlist
        run: npm run audit:styles

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: npm run build

      # Needs dist/ from the step above, and Chrome, which the runner image
      # ships. The script finds a binary itself rather than this pinning a path
      # that may move between images, and CHROME_PATH overrides it. Covers
      # horizontal overflow, WCAG AA contrast, and image scaling across every
      # route at 320, 375, 768, and 1024: the kind of bug that's invisible to
      # every check above it.
      - name: Browser audit
        run: npm run audit:browser
