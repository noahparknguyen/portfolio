# Runs the same seven checks as `pnpm run check`, so none of them depends on
# someone remembering to run it locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm named by `packageManager` in package.json and the Node
      # named by `devEngines.runtime`, then runs `pnpm install`. With
      # `require-lockfile`, a missing pnpm-lock.yaml fails the job rather than
      # being quietly created, so the lockfile is what gets tested.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      # Ordered cheapest-first, so an obvious failure reports in seconds rather
      # than after the browser pass.
      - name: Lint
        run: pnpm run lint

      - name: Formatting
        run: pnpm run format:check

      # Catches docs/index.html's colour tokens falling out of step with
      # src/index.css, which nothing else can see.
      - name: Config consistency
        run: pnpm run check:config

      # Opens every favicon file, which nothing else does: a broken one only
      # shows in a tab, a search result, or on a home screen.
      - name: Icons
        run: pnpm run check:icons

      - name: Style allowlist
        run: pnpm run audit:styles

      - name: Unit tests
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      # Needs dist/ from the step above, and Chrome, which the runner image
      # ships. The script finds a binary itself rather than this pinning a path
      # that may move between images, and CHROME_PATH overrides it. Covers
      # horizontal overflow, WCAG AA contrast, and image scaling across every
      # route at 320, 375, 768, and 1024: the kind of bug that's invisible to
      # every check above it.
      - name: Browser audit
        run: pnpm run audit:browser
